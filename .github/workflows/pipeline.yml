name: profile pipeline

# Extract GitHub data, transform it, load fresh SVGs into assets/.
on:
  schedule:
    - cron: "0 6 * * *" # every day, 06:00 UTC (03:00 in São Paulo)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/pipeline.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        run: python pipeline/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes in the data."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
